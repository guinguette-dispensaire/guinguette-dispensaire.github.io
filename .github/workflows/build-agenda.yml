name: Regeneration de l'agenda des concerts

# Régénère agenda.html à partir de l'onglet « concerts » du Sheet, et la
# committe si elle a changé. Deux passages par jour : 7h10 et 17h10 heure de
# Paris (UTC+2 l'été -> 5h10 et 15h10 UTC).
#
# Le bouton « Run workflow » permet un essai « à blanc » : par défaut il NE
# committe PAS (publier = false) et se contente d'afficher le diff, pour
# vérifier avant de mettre en ligne. Mettre publier = true pour publier.
on:
  schedule:
    - cron: '10 5 * * *'
    - cron: '10 15 * * *'
  workflow_dispatch:
    inputs:
      publier:
        description: 'Committer et publier le résultat ?'
        type: boolean
        required: false
        default: false

# Le token par défaut doit pouvoir committer le fichier régénéré.
permissions:
  contents: write

# Jamais deux régénérations en parallèle (elles écriraient le même fichier).
concurrency:
  group: build-agenda
  cancel-in-progress: false

jobs:
  agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dependances
        run: npm install --no-audit --no-fund googleapis

      - name: Regenerer agenda.html
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node outils/build-agenda.mjs

      - name: Apercu des changements (toujours affiche)
        run: |
          echo "=== git status ==="
          git status --porcelain agenda.html
          echo "=== diff (stat) ==="
          git --no-pager diff --stat agenda.html || true
          echo "=== diff (500 premieres lignes) ==="
          git --no-pager diff agenda.html | head -500 || true

      - name: Committer si l'agenda a change
        if: ${{ github.event_name == 'schedule' || github.event.inputs.publier == 'true' }}
        run: |
          if [ -n "$(git status --porcelain agenda.html)" ]; then
            git config user.name "guinguette-bot"
            git config user.email "actions@users.noreply.github.com"
            git add agenda.html
            git commit -m "Agenda : regeneration auto des concerts depuis le planning"
            git push
            echo "agenda.html mis a jour et pousse."
          else
            echo "Aucun changement de l'agenda."
          fi
