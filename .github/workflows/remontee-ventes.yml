name: Remontee des ventes Flatpay

# Deux passages fixes : 22h et 07h, heure de Paris.
# GitHub ne connait que l'UTC : en heure d'ete Paris est a UTC+2, donc 20:00 et
# 05:00 UTC. En heure d'hiver ces horaires glisseraient a 21h et 6h.
#
# Plus un passage toutes les 15 minutes qui ne fait RIEN, sauf si le bouton
# « Lancer la remontee maintenant » de l'outil a pose une demande dans la base.
on:
  schedule:
    - cron: '0 20 * * *'
    - cron: '0 5 * * *'
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      depuis:
        description: 'Reconsolidation : date de debut (AAAA-MM-JJ). Laisser vide pour la remontee normale.'
        required: false
        default: ''
      jusqua:
        description: 'Reconsolidation : date de fin (AAAA-MM-JJ).'
        required: false
        default: ''
      reconsolider:
        description: 'Relire et REECRIRE les journees deja en base sur cette periode'
        type: boolean
        required: false
        default: false

jobs:
  remontee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Passage de quart d'heure : on ne reveille la machinerie que si le
      # bouton de l'outil a pose une demande. Sinon on s'arrete ici, en une
      # vingtaine de secondes et sans installer de navigateur.
      - name: Y a-t-il une demande en attente ?
        id: portier
        if: github.event.schedule == '*/15 * * * *'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm install --no-audit --no-fund firebase-admin
          if node outils/demande-en-attente.mjs; then
            echo "suite=oui" >> $GITHUB_OUTPUT
          else
            echo "suite=non" >> $GITHUB_OUTPUT
          fi

      - name: Installer les dependances
        if: github.event.schedule != '*/15 * * * *' || steps.portier.outputs.suite == 'oui'
        run: npm install --no-audit --no-fund playwright firebase-admin googleapis

      - name: Installer le navigateur
        if: github.event.schedule != '*/15 * * * *' || steps.portier.outputs.suite == 'oui'
        run: npx playwright install --with-deps chromium

      - name: Remonter les ventes
        if: github.event.schedule != '*/15 * * * *' || steps.portier.outputs.suite == 'oui'
        env:
          FLATPAY_EMAIL: ${{ secrets.FLATPAY_EMAIL }}
          FLATPAY_PASSWORD: ${{ secrets.FLATPAY_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DEPUIS: ${{ inputs.depuis }}
          JUSQUA: ${{ inputs.jusqua }}
          RECONSOLIDER: ${{ inputs.reconsolider && 'oui' || 'non' }}
        run: node outils/remontee-ventes.mjs

      # Le planning : le tableau du Drive et l'outil se recopient l'un l'autre.
      # Independant de la remontee des ventes — si Flatpay tombe, le planning
      # se synchronise quand meme.
      - name: Synchroniser le planning
        if: always() && (github.event.schedule != '*/15 * * * *' || steps.portier.outputs.suite == 'oui')
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node outils/sync-planning.mjs
