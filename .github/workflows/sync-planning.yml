name: Synchronisation du planning

# Le planning et les concerts, dans les deux sens, quatre fois par jour.
#
# Les heures sont calees sur la journee de la guinguette : 7h avant l'ouverture,
# 13h, 19h avant le coup de feu, 23h a la fermeture. GitHub ne connait que
# l'UTC — en heure d'ete Paris est a UTC+2, d'ou 5h, 11h, 17h et 21h.
#
# Pour ne pas attendre le prochain passage, le bouton « Run workflow » de cette
# page declenche la synchronisation sur-le-champ.

on:
  schedule:
    - cron: '0 5,11,17,21 * * *'
  workflow_dispatch:

# Deux synchronisations en meme temps ecriraient dans le meme tableau. On n'en
# laisse passer qu'une a la fois ; celle qui arrive pendant attend son tour.
concurrency:
  group: planning
  cancel-in-progress: false

jobs:
  planning:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dependances
        run: npm install --no-audit --no-fund firebase-admin googleapis

      - name: Synchroniser
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node outils/sync-planning.mjs
